<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffcc00" />
    <meta name="description" content="Short layover, just Zoot! A timed 3D walking quest across Singapore that always gets you back to the gate." />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/brand/zoot-badge-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Zoot</title>
    <script>
      try {
        // One-time move of data saved under the old "lq." prefix, so nobody loses stamps in the rebrand.
        for (var i = localStorage.length - 1; i >= 0; i--) {
          var k = localStorage.key(i)
          if (k && k.indexOf('lq.') === 0) {
            var nk = 'zoot.' + k.slice(3)
            if (localStorage.getItem(nk) === null) localStorage.setItem(nk, localStorage.getItem(k))
            localStorage.removeItem(k)
          }
        }
        // Apply the saved theme before first paint to avoid a flash.
        var t = localStorage.getItem('zoot.theme')
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-bs-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
